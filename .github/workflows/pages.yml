name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: sed -i "s/name=\"cvc-build\" content=\"dev\"/name=\"cvc-build\" content=\"${GITHUB_SHA::7}\"/" public/index.html
      - uses: actions/configure-pages@v5
        id: pages
      - name: Insert the site address into share tags
        run: sed -i "s|__SITE_URL__|${{ steps.pages.outputs.base_url }}|g" public/index.html public/robots.txt public/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
